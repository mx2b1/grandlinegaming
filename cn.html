<!DOCTYPE html>
<html lang="en">

<head>
    <link href="newwww.png" type="image/x-icon" rel="icon">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="keywords" content="Grandline Gaming,GRANDLINE,Grandline,randline gaming ">
    <meta name="author" content="Mohammed">
    <meta name="description" content="Grandline Gaming - Buy Games, Accounts and Gift Cards">
    <title>Grandline Gaming - Contact Us</title>
    <link rel="stylesheet" href="c.css">
    <script src="shared.js"></script>
</head>

<body>

    <!-- NAVBAR dynamically injected by shared.js -->
    <nav></nav>

    <div class="contact-page">

        <!-- Center Box: Form -->
        <div class="contact-box">
            <h1>Contact Us</h1>
            <p class="contact-text">Need help or have questions? Send a direct transmission to our crew.</p>

            <form id="contactForm" onsubmit="handleContactSubmit(event)">
                <input type="text" placeholder="Full Name" required>
                <input type="tel" placeholder="Phone Number" required>
                <input type="email" placeholder="Email Address" required>
                <textarea placeholder="Write your message..." rows="6" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>

    </div>

    <!-- CONTACT LOGIC -->
    <script>
        function handleContactSubmit(event) {
            event.preventDefault();

            // Clear inputs
            document.getElementById("contactForm").reset();

            // Fire global shared.js toast success popup
            showToast("Transmission successfully beamed! Our crew will respond shortly. ⚡");
        }
    </script>

    <footer>
        © 2026 Grandline Gaming — All Rights Reserved
    </footer>

</body>

</html>
