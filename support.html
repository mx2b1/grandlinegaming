<!DOCTYPE html>
<html lang="en">

<head>
    <link href="newwww.png" type="image/x-icon" rel="icon">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="keywords" content="Grandline Gaming,GRANDLINE,Grandline,support,chat">
    <meta name="author" content="Mohammed">
    <meta name="description" content="Grandline Gaming - Direct Secure Holographic Live Support Channel">
    <title>Grandline Gaming - Support Channel</title>
    <link rel="stylesheet" href="c.css">
    <script src="shared.js"></script>
    <style>
        /* ==========================================================================
           SUPPORT PORTAL CYBERPUNK INTERFACE STYLES
           ========================================================================== */

        .chat-portal-container {
            max-width: 800px;
            margin: 40px auto 100px auto;
            padding: 0 20px;
            width: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .chat-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: var(--glow-cyan);
            margin-bottom: 6px;
        }

        .chat-header p {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* --- THE MESSAGE CENTER TERMINAL --- */
        .chat-box-card {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            height: 550px;
            position: relative;
            overflow: hidden;
        }

        /* System Info Status Band */
        .chat-status-bar {
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--neon-green);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green);
            animation: pulseStatus 1.8s infinite ease-in-out;
        }

        @keyframes pulseStatus {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Messages area wrapper */
        .chat-messages-area {
            flex-grow: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.02) 0%, transparent 80%);
        }

        /* Message Bubbles */
        .msg-bubble-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            width: fit-content;
        }

        .msg-bubble-wrapper.outgoing {
            align-self: flex-end;
            align-items: flex-end;
        }

        .msg-bubble-wrapper.incoming {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-bubble {
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 0.92rem;
            line-height: 1.5;
            font-family: 'Outfit', sans-serif;
        }

        .outgoing .msg-bubble {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1), rgba(170, 124, 17, 0.05));
            border: 1px solid rgba(212, 175, 55, 0.35);
            color: var(--text-primary);
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.05);
        }

        .incoming .msg-bubble {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-bottom-left-radius: 2px;
        }

        .msg-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 5px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.5px;
        }

        /* --- INPUT CONTROL BAR --- */
        .chat-input-bar {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .chat-text-input {
            flex-grow: 1;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 30px;
            font-size: 0.95rem;
            color: var(--text-primary);
            transition: all var(--transition-speed);
        }

        .chat-text-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: var(--glow-cyan);
            outline: none;
            background: rgba(10, 9, 6, 0.8);
        }

        .chat-send-btn {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            color: #000;
            padding: 12px 24px;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 0.82rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all var(--transition-speed);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-send-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-cyan);
        }

        .chat-send-btn:active {
            transform: translateY(0);
        }

        /* Empty message box state */
        .chat-empty-state {
            text-align: center;
            margin: auto;
            color: var(--text-muted);
            max-width: 320px;
        }

        .chat-empty-state div {
            font-size: 3rem;
            margin-bottom: 12px;
            animation: floatSupportIcon 3s infinite ease-in-out;
        }

        @keyframes floatSupportIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Custom Scrollbars */
        .chat-messages-area::-webkit-scrollbar {
            width: 5px;
        }
        .chat-messages-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages-area::-webkit-scrollbar-thumb {
            background: var(--border-glass);
            border-radius: 4px;
        }
        .chat-messages-area::-webkit-scrollbar-thumb:hover {
            background: var(--neon-cyan);
        }
    </style>
</head>

<body>

    <!-- NAVBAR dynamically injected by shared.js -->
    <nav></nav>

    <div class="chat-portal-container">

        <!-- Header -->
        <header class="chat-header">
            <h1>SUPPORT CHANNEL</h1>
            <p>Direct secure communication node to the Grandline Command Crew</p>
        </header>

        <!-- Chat Portal Console -->
        <div class="chat-box-card">
            
            <!-- Status Info Bar -->
            <div class="chat-status-bar">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span>CHANNEL SECURED</span>
                </div>
                <div style="color: var(--text-secondary);">OPERATOR: COMMAND CREW</div>
            </div>

            <!-- Messages Timeline Area -->
            <div class="chat-messages-area" id="chatMessagesTimeline">
                <!-- Message timeline bubbles go here -->
            </div>

            <!-- Input controller panel -->
            <div class="chat-input-bar">
                <input type="text" class="chat-text-input" id="messageTextInput" onkeydown="handleInputKeyPress(event)" placeholder="Type a message to the Grandline crew...">
                <button class="chat-send-btn" onclick="sendMessage()">
                    <span>🚀</span> SEND
                </button>
            </div>

        </div>

    </div>

    <!-- CHAT COMMUNICATION WORKSPACE SCRIPT -->
    <script>
        const chatArea = document.getElementById("chatMessagesTimeline");
        const inputField = document.getElementById("messageTextInput");
        const currentUser = getCurrentUser();

        // Refresh and render the dialogue thread
        function renderDialogue() {
            const allMessages = JSON.parse(localStorage.getItem("gl_messages") || "[]");
            
            // Filter dialogue exchanged between current user and admin m_x2b2
            const dialogue = allMessages.filter(msg => 
                (msg.from === currentUser && msg.to === "m_x2b2") || 
                (msg.from === "m_x2b2" && msg.to === currentUser)
            );

            // Sort by time (oldest first)
            dialogue.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            if (dialogue.length === 0) {
                chatArea.innerHTML = `
                    <div class="chat-empty-state">
                        <div>💬</div>
                        <p style="font-family:'Orbitron'; font-size:0.9rem; font-weight:600; color:var(--text-secondary); margin-bottom:8px;">TRANSMITTER STANDBY</p>
                        <p style="font-size:0.8rem;">No messages exchanged yet. Send a direct transmission and our crew will respond as soon as they log in.</p>
                    </div>
                `;
                return;
            }

            chatArea.innerHTML = "";

            dialogue.forEach(msg => {
                const isOutgoing = (msg.from === currentUser);
                const wrapper = document.createElement("div");
                wrapper.className = `msg-bubble-wrapper ${isOutgoing ? 'outgoing' : 'incoming'}`;
                
                const bubble = document.createElement("div");
                bubble.className = "msg-bubble";
                bubble.innerText = msg.content;
                
                const meta = document.createElement("div");
                meta.className = "msg-meta";
                
                // Format name labels nicely
                const senderName = isOutgoing ? "YOU" : "GRANDLINE CREW";
                meta.innerText = `${senderName} • ${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

                wrapper.appendChild(bubble);
                wrapper.appendChild(meta);
                chatArea.appendChild(wrapper);
            });

            // Auto scroll to bottom
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Send a message
        function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            let allMessages = JSON.parse(localStorage.getItem("gl_messages") || "[]");
            
            const newMsg = {
                id: "MSG-" + Date.now() + Math.floor(Math.random() * 1000),
                from: currentUser,
                to: "m_x2b2",
                content: text,
                timestamp: new Date().toISOString(),
                read: false
            };

            allMessages.push(newMsg);
            localStorage.setItem("gl_messages", JSON.stringify(allMessages));

            // Clean inputs and reload dialogue
            inputField.value = "";
            renderDialogue();
            
            // Dispatch dynamic state update for real-time response if admin page is open
            window.dispatchEvent(new Event("storage"));

            // Trigger simulated bot reply if user is talking to admin but admin is offline, for a premium feel
            simulateCrewReply(text);
        }

        // Simulated intelligent chatbot receipt responses (looks amazing and keeps things responsive)
        function simulateCrewReply(userText) {
            const lowText = userText.toLowerCase();
            let autoReply = "";

            if (lowText.includes("hello") || lowText.includes("hi") || lowText.includes("hey")) {
                autoReply = "Greetings spacefarer! We've received your greeting. How can we help you in the Grandline Gaming Hub today? 🪙";
            } else if (lowText.includes("coin") || lowText.includes("glc") || lowText.includes("wallet")) {
                autoReply = "Need more GLC coins? Play retro games in our Arcade tab to earn score points, then redeem them at Cart checkout to receive direct coupons! 🎮";
            } else if (lowText.includes("refund") || lowText.includes("cancel") || lowText.includes("return")) {
                autoReply = "Transactions on the secure Grandline ledger are typically permanent, but you can leave your email, order ID, and reason here. Our administrative officers will review it shortly!";
            } else {
                // Default acknowledgment
                autoReply = "Transmission received! Your message has been logged in our secure ledger. An administrative crew officer will review this conversation and reply directly to you shortly. 🛡️";
            }

            // Delayed simulation reply
            setTimeout(() => {
                let allMessages = JSON.parse(localStorage.getItem("gl_messages") || "[]");
                
                // Add simulated reply from admin
                allMessages.push({
                    id: "MSG-AUTO-" + Date.now(),
                    from: "m_x2b2",
                    to: currentUser,
                    content: autoReply,
                    timestamp: new Date().toISOString(),
                    read: false
                });

                localStorage.setItem("gl_messages", JSON.stringify(allMessages));
                renderDialogue();
            }, 2500);
        }

        function handleInputKeyPress(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        }

        // Bootstrap load and setup polling loop to pull updates dynamically
        document.addEventListener("DOMContentLoaded", () => {
            renderDialogue();
            
            // Poll for new messages every 3 seconds
            setInterval(renderDialogue, 3000);
        });
    </script>

    <!-- FOOTER -->
    <footer>
        © 2026 Grandline Gaming — All Rights Reserved
    </footer>

</body>
</html>
